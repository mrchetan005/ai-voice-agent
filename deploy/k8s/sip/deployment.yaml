apiVersion: apps/v1
kind: Deployment
metadata:
  name: voiceagent-sip
  labels:
    app.kubernetes.io/name: voiceagent-sip
    app.kubernetes.io/component: sip
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voiceagent-sip
      app.kubernetes.io/component: sip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voiceagent-sip
        app.kubernetes.io/component: sip
    spec:
      # Host networking so the SIP service can bind the wide RTP range on the
      # node. ClusterFirstWithHostNet keeps in-cluster DNS (livekit, redis)
      # resolvable while on the host network.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Prepend the api_key/api_secret (from the Secret) to the non-secret
        # base config. printf %s handles any special characters safely — no
        # sed-delimiter hazard.
        - name: render-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              printf 'api_key: %s\napi_secret: %s\n'
              "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" > /shared/sip.yaml &&
              cat /tpl/base.yaml >> /shared/sip.yaml
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voiceagent-secrets
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: voiceagent-secrets
                  key: LIVEKIT_API_SECRET
          volumeMounts:
            - name: tpl
              mountPath: /tpl
              readOnly: true
            - name: shared
              mountPath: /shared
      containers:
        - name: sip
          image: livekit/sip:v1.14.0
          args: ["--config", "/shared/sip.yaml"]
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: tpl
          configMap:
            name: voiceagent-sip
        - name: shared
          emptyDir: {}
