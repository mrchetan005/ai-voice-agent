# Cluster-internal handle for the SIP pod. External SIP traffic reaches the
# service on the NODE's IP:5060 because the pod uses hostNetwork; this Service
# is for in-cluster discovery/observability, not the external ingress path.
apiVersion: v1
kind: Service
metadata:
  name: voiceagent-sip
  labels:
    app.kubernetes.io/name: voiceagent-sip
    app.kubernetes.io/component: sip
spec:
  selector:
    app.kubernetes.io/name: voiceagent-sip
    app.kubernetes.io/component: sip
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP
