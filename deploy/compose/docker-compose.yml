# Local development stack: LiveKit + Redis + Postgres + platform API + worker.
#   cp .env.example .env          (repo root; mock agent needs no provider keys)
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Profiles:
#   --profile recording   adds MinIO + LiveKit Egress
#   --profile sip         adds the LiveKit SIP service

name: voiceagent

services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml
    ports:
      - "7880:7880"           # ws / http
      - "7881:7881"           # rtc tcp fallback
      - "50100-50160:50100-50160/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    volumes:
      - pg-data:/var/lib/postgresql/data
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: voiceagent-api
    env_file: ../../.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      # Advertised to clients. Use the IPv4 literal, not "localhost": Docker
      # publishes the port on IPv4 only, and native rtc clients (integration
      # test, loadtest driver) resolve "localhost" to IPv6 ::1 first and hang.
      # Browsers dual-stack-fallback so the demo works with either.
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:7880
      PLATFORM_DATABASE_URL: postgresql://voiceagent:voiceagent@postgres:5432/voiceagent
      PLATFORM_REDIS_URL: redis://redis:6379/0
      VOICEAGENT_AGENTS_FILE: /app/examples/agents.yaml
    ports:
      - "8080:8080"
    depends_on:
      livekit: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: voiceagent-worker start
    env_file: ../../.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      PLATFORM_DATABASE_URL: postgresql://voiceagent:voiceagent@postgres:5432/voiceagent
      PLATFORM_REDIS_URL: redis://redis:6379/0
      VOICEAGENT_AGENTS_FILE: /app/examples/agents.yaml
    ports:
      - "9100:9100"           # prometheus metrics
    depends_on:
      livekit: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    stop_grace_period: 610s   # >= WORKER_DRAIN_TIMEOUT_S so live calls finish

  # --- profile: recording ----------------------------------------------------
  minio:
    profiles: ["recording"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voiceagent
      MINIO_ROOT_PASSWORD: voiceagent-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  egress:
    profiles: ["recording"]
    image: livekit/egress:v1.14.1
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret_devsecret_devsecret_123456
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    depends_on:
      livekit: { condition: service_healthy }
      redis: { condition: service_started }

  # --- profile: sip ------------------------------------------------------------
  sip:
    profiles: ["sip"]
    image: livekit/sip:v1.14.0
    network_mode: host        # SIP/RTP needs real ports; host networking in dev
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret_devsecret_devsecret_123456
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: false
        logging:
          level: info

volumes:
  redis-data:
  pg-data:
  minio-data:

# Inline configs are sent via the Docker API — zero host bind mounts, so
# Docker Desktop drive-sharing issues on Windows can't break the stack.
# Sources of truth: ./livekit.yaml and ./init.sql (keep in sync).
configs:
  livekit_config:
    content: |
      # LiveKit server config for LOCAL DEVELOPMENT only.
      # Single node, no TURN, no external IP discovery, dev credentials.
      port: 7880
      rtc:
        tcp_port: 7881
        port_range_start: 50100
        port_range_end: 50160
        use_external_ip: false
      keys:
        # Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env (secret >= 32 chars).
        devkey: devsecret_devsecret_devsecret_123456
      # Shared bus for egress/sip RPC (the compose stack always runs redis).
      redis:
        address: redis:6379
      room:
        auto_create: true
      logging:
        level: info
        json: false
  init_sql:
    content: |
      -- Platform schema. Applied automatically by the postgres container on first
      -- boot; apply manually (psql -f) or via the Helm hook Job in Kubernetes.
      CREATE TABLE IF NOT EXISTS sessions (
          id            uuid PRIMARY KEY,
          tenant_id     text NOT NULL DEFAULT 'default',
          agent_id      text NOT NULL,
          channel       text NOT NULL DEFAULT 'browser',
          room          text NOT NULL,
          user_id       text,
          started_at    timestamptz NOT NULL DEFAULT now(),
          ended_at      timestamptz,
          status        text NOT NULL DEFAULT 'pending',
          usage         jsonb,
          cost_usd      numeric,
          recording_url text
      );
      CREATE INDEX IF NOT EXISTS sessions_agent_started ON sessions (agent_id, started_at DESC);

      -- Durable conversation memory (used by the postgres Memory backend).
      CREATE TABLE IF NOT EXISTS memory_messages (
          key     text NOT NULL,
          role    text NOT NULL,
          content text NOT NULL,
          ts      double precision NOT NULL
      );
      CREATE INDEX IF NOT EXISTS memory_messages_key_ts ON memory_messages (key, ts);

