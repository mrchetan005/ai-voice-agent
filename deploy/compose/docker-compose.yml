# Local development stack: LiveKit + Redis + Postgres + platform API + worker.
#   cp .env.example .env          (repo root; mock agent needs no provider keys)
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Profiles:
#   --profile recording   adds MinIO + LiveKit Egress
#   --profile sip         adds the LiveKit SIP service

name: voiceagent

services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"           # ws / http
      - "7881:7881"           # rtc tcp fallback
      - "50100-50160:50100-50160/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: voiceagent-api
    env_file: ../../.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      PLATFORM_DATABASE_URL: postgresql://voiceagent:voiceagent@postgres:5432/voiceagent
      PLATFORM_REDIS_URL: redis://redis:6379/0
      VOICEAGENT_AGENTS_FILE: /app/examples/agents.yaml
    ports:
      - "8080:8080"
    depends_on:
      livekit: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: voiceagent-worker start
    env_file: ../../.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      PLATFORM_DATABASE_URL: postgresql://voiceagent:voiceagent@postgres:5432/voiceagent
      PLATFORM_REDIS_URL: redis://redis:6379/0
      VOICEAGENT_AGENTS_FILE: /app/examples/agents.yaml
    ports:
      - "9100:9100"           # prometheus metrics
    depends_on:
      livekit: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    stop_grace_period: 610s   # >= WORKER_DRAIN_TIMEOUT_S so live calls finish

  # --- profile: recording ----------------------------------------------------
  minio:
    profiles: ["recording"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voiceagent
      MINIO_ROOT_PASSWORD: voiceagent-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  egress:
    profiles: ["recording"]
    image: livekit/egress:v1.14.1
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret_devsecret_devsecret_123456
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    depends_on:
      livekit: { condition: service_healthy }
      redis: { condition: service_started }

  # --- profile: sip ------------------------------------------------------------
  sip:
    profiles: ["sip"]
    image: livekit/sip:v1.14.0
    network_mode: host        # SIP/RTP needs real ports; host networking in dev
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: devsecret_devsecret_devsecret_123456
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: false
        logging:
          level: info

volumes:
  redis-data:
  pg-data:
  minio-data:
