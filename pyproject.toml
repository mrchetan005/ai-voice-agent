[project]
name = "voiceagent"
version = "0.2.0"
description = "Reusable voice-agent framework on self-hosted LiveKit: define agents in code or config, connect them to browser, SIP, and WhatsApp."
readme = "README.md"
authors = [
    { name = "Chetan", email = "mr.chetan005@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agents = [
    "livekit-agents[deepgram,cartesia,elevenlabs,google,openai,silero,turn-detector]~=1.8.0",
    "livekit-api>=1.2",
    "livekit>=1.1",
]
platform = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
]
whatsapp = [
    "aiortc>=1.9",
    "av>=12",                       # used directly for resampling (aiortc ships it)
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "livekit>=1.1",                 # rtc room bridge (no livekit-agents here)
    "livekit-api>=1.2",            # dispatch the agent + mint the bridge token
]
obs = [
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
all = ["voiceagent[agents,platform,whatsapp,obs]"]

[project.scripts]
voiceagent-worker = "voiceagent.livekit.worker:worker_main"
voiceagent-api = "voiceagent.platform.app:main"
voiceagent-whatsapp = "voiceagent.channels.whatsapp.service:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.23", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live and not integration'"
markers = [
    "live: hits real provider APIs; needs keys in .env (frugal - credits limited)",
    "integration: needs the local compose stack (livekit+redis+postgres); costs $0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "DTZ", "RUF", "FURB"]
# BLE001 ignored: broad `except Exception` in the live call path is by
# design — a failed tool call or persist must never drop a voice session.
# Every such catch logs.
ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceagent"]
